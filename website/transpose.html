<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Transpose / Sheet Music — BeepBox: Reborn</title>
<link href="https://fonts.googleapis.com/css?family=Roboto" rel="stylesheet" media="none" onload="if (this.media != 'all') this.media='all';" />
<style>
	html, body {
		margin: 0;
		background: #000;
		color: #fff;
		font-family: 'Roboto', sans-serif;
		font-size: 13px;
		line-height: 1.4;
	}
	.wrap { max-width: 900px; margin: 0 auto; padding: 16px 16px 60px 16px; }
	.failure { color: #999; }
</style>
</head>
<body>
<div class="wrap" id="root">Loading song&hellip;</div>

<script type="text/javascript" src="beepbox_synth.js"></script>
<script type="text/javascript" src="instruments.js"></script>
<script type="text/javascript" src="sheetmusic.js"></script>
<script type="text/javascript" src="transposeui.js"></script>
<script type="text/javascript">
(function () {
	"use strict";
	var root = document.getElementById("root");
	var hash = location.hash.replace(/^#/, "");

	function fail(message) {
		root.className = "wrap failure";
		root.textContent = message;
	}

	if (!hash) {
		fail("No song in the link. Open this from the editor's Transpose button.");
		return;
	}

	var song;
	try {
		song = new beepbox.Song(hash);
	} catch (err) {
		fail("Could not read the song: " + err.message);
		return;
	}

	TransposeUI.mount(root, song, {
		onApply: function (songString) { location.href = "index.html#" + songString; },
		onClose: function () { location.href = "index.html#" + hash; }
	});
}());
</script>
</body>
</html>
