<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Transpose / Sheet Music — BeepBox: Reborn</title>
<link href="https://fonts.googleapis.com/css?family=Roboto" rel="stylesheet" media="none" onload="if (this.media != 'all') this.media='all';" />
<style>
	:root {
		--bg: #000;
		--panel: #1c1c1c;
		--line: #444;
		--text: #fff;
		--dim: #999;
		--accent: #ff4452;
	}
	html, body {
		margin: 0;
		background: var(--bg);
		color: var(--text);
		font-family: 'Roboto', sans-serif;
		font-size: 13px;
		line-height: 1.4;
	}
	.wrap { max-width: 900px; margin: 0 auto; padding: 16px 16px 60px 16px; }
	h1 { font-size: 20px; margin: 0 0 2px 0; }
	.sub { color: var(--dim); margin-bottom: 18px; }
	a { color: var(--accent); }
	.row {
		display: flex; align-items: center; gap: 10px;
		padding: 8px 10px; margin-bottom: 6px;
		background: var(--panel); border-radius: 5px;
	}
	.swatch { width: 10px; height: 22px; border-radius: 3px; flex-shrink: 0; }
	.name { flex: 1; min-width: 0; }
	.name b { display: block; }
	.name span { color: var(--dim); font-size: 12px; }
	select {
		background: var(--line); color: var(--text); border: none;
		border-radius: 4px; height: 26px; font-family: inherit; font-size: 12px;
		padding: 0 6px; max-width: 230px;
	}
	button {
		background: var(--line); color: var(--text); border: none;
		border-radius: 5px; height: 30px; padding: 0 14px;
		font-family: inherit; font-size: 13px; cursor: pointer;
	}
	button:hover { background: #555; }
	button.primary { background: var(--accent); color: #fff; font-weight: bold; }
	button.primary:hover { filter: brightness(1.1); }
	.bar { display: flex; gap: 8px; align-items: center; margin: 16px 0; }
	.note { color: var(--dim); font-size: 12px; }
	#sheet { margin-top: 20px; }
	#sheet svg { background: #fff; border-radius: 4px; margin-bottom: 10px; display: block; max-width: 100%; height: auto; }
	.part-title { margin: 14px 0 4px 0; font-weight: bold; }
	.part-title span { color: var(--dim); font-weight: normal; }
	.empty { color: var(--dim); font-style: italic; }
</style>
</head>
<body>
<div class="wrap">
	<h1>Transpose &amp; Sheet Music</h1>
	<div class="sub" id="songinfo">Loading song&hellip;</div>
	<div class="sub">Pick an instrument for each part. That swaps the sound <em>and</em> writes
	the part at the pitch that player reads &mdash; concert B&#9837; shows as G for an alto sax.</div>

	<div id="parts"></div>

	<div class="bar">
		<button class="primary" id="generate">Generate Sheet Music</button>
		<button id="apply">Apply instruments &amp; open in editor</button>
		<button id="back">Back to editor</button>
		<span class="note" id="status"></span>
	</div>

	<div id="sheet"></div>
</div>

<script type="text/javascript" src="beepbox_synth.js"></script>
<script type="text/javascript" src="instruments.js"></script>
<script type="text/javascript" src="sheetmusic.js"></script>
<script type="text/javascript">
(function () {
	"use strict";
	var hash = location.hash.replace(/^#/, "");
	var info = document.getElementById("songinfo");
	var partsEl = document.getElementById("parts");

	document.getElementById("back").addEventListener("click", function () {
		location.href = "index.html#" + hash;
	});

	if (!hash) {
		info.textContent = "No song in the link. Open this from the editor's Transpose button.";
		return;
	}

	var song;
	try {
		song = new beepbox.Song(hash);
	} catch (err) {
		info.textContent = "Could not read the song: " + err.message;
		return;
	}

	var keyName = beepbox.Config.keys[song.key].name;
	info.innerHTML = "Concert <b>" + keyName + "</b> &middot; " + song.barCount +
		" measure" + (song.barCount === 1 ? "" : "s") + " &middot; " +
		song.beatsPerBar + " beats per measure &middot; " + song.tempo + " BPM";

	// Each row picks what the part should be WRITTEN for. BeepBox songs are in
	// concert pitch, so "Concert pitch" means leave it alone - the default.
	var selects = [];
	for (var i = 0; i < song.getChannelCount(); i++) {
		if (song.getChannelIsNoise(i)) continue;
		var channel = song.channels[i];
		var noteCount = 0;
		for (var p = 0; p < channel.patterns.length; p++) noteCount += channel.patterns[p].notes.length;

		var row = document.createElement("div");
		row.className = "row";

		var sw = document.createElement("div");
		sw.className = "swatch";
		sw.style.background = SheetMusic.channelColor(i);
		row.appendChild(sw);

		var name = document.createElement("div");
		name.className = "name";
		name.innerHTML = "<b>Channel " + (i + 1) + "</b><span>" + noteCount +
			" note" + (noteCount === 1 ? "" : "s") + "</span>";
		row.appendChild(name);

		var sel = document.createElement("select");
		var keep = document.createElement("option");
		keep.value = "-1";
		keep.textContent = "Keep current instrument";
		sel.appendChild(keep);
		for (var t = 0; t < INSTRUMENTS.length; t++) {
			var opt = document.createElement("option");
			opt.value = String(t);
			opt.textContent = INSTRUMENTS[t].name +
				(INSTRUMENTS[t].semitones ? "" : "  \u00b7 concert");
			sel.appendChild(opt);
		}
		sel.value = "-1";
		row.appendChild(sel);
		selects.push({channelIndex: i, select: sel});

		partsEl.appendChild(row);
	}

	if (selects.length === 0) {
		partsEl.innerHTML = '<div class="empty">This song has no pitched channels to transpose.</div>';
	}

	function chosen(entry) {
		var idx = parseInt(entry.select.value, 10);
		return idx >= 0 ? INSTRUMENTS[idx] : null;
	}

	document.getElementById("generate").addEventListener("click", function () {
		var status = document.getElementById("status");
		var sheet = document.getElementById("sheet");
		sheet.innerHTML = "";
		var wrote = 0;
		for (var s = 0; s < selects.length; s++) {
			var out = SheetMusic.renderChannel(song, selects[s].channelIndex, chosen(selects[s]));
			if (out) { sheet.appendChild(out); wrote++; }
		}
		status.textContent = wrote === 0
			? "Nothing to write - no notes in this song yet."
			: "Wrote " + wrote + " part" + (wrote === 1 ? "" : "s") + ".";
	});

	// Swapping the instrument changes the song itself, so hand the edited song
	// back to the editor as a new link.
	document.getElementById("apply").addEventListener("click", function () {
		var status = document.getElementById("status");
		var changed = 0;
		for (var s = 0; s < selects.length; s++) {
			var instrument = chosen(selects[s]);
			if (!instrument) continue;
			var channel = song.channels[selects[s].channelIndex];
			for (var k = 0; k < channel.instruments.length; k++) {
				channel.instruments[k].fromJsonObject(instrument.settings, false, 0);
				channel.instruments[k].preset = instrument.value;
			}
			changed++;
		}
		if (changed === 0) {
			status.textContent = "No instruments picked yet.";
			return;
		}
		location.href = "index.html#" + song.toBase64String();
	});
}());
</script>
</body>
</html>
